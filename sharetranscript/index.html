     the redirect, so it carries the same preview card as the homepage. -->

<meta property="og:description" content="Transcribed on-device by Life Recorder, the Android app that saves audio AFTER the moment happened. Free on Google Play.">

<link rel="preconnect" href="https://www.google-analytics.com" crossorigin>
<!-- Fallback if JS is disabled or the tracked redirect below does not run -->
<meta http-equiv="refresh" content="3; url=https://play.google.com/store/apps/details?id=com.record.liferecorder&amp;referrer=utm_source%3Dliferecorderapp.com%26utm_medium%3Dweb%26utm_campaign%3Dsharetranscript">
<!-- GA4 by hand, not gtag.js: this page leaves for Play at once, and an async library
     that has not finished loading sends nothing. 2026-09-15: /share and /shareapp showed
     7 sessions in 28 days while the referral ledger proved the links were really used -
     the 800ms wait added for the same reason still lost every slow mobile load. sendBeacon
     is queued by the browser and survives the navigation, so the hit no longer races it. -->
<script>
(function(){
  var C="sharetranscript";  // the only line that differs between the redirect pages
  var target="https://play.google.com/store/apps/details?id=com.record.liferecorder&referrer=utm_source%3Dliferecorderapp.com%26utm_medium%3Dweb%26utm_campaign%3D"+C;
  // The sharer's invite code rides into the Play install referrer, where the friend's
  // first launch reads it and both sides get their PRO days (ReferralManager in the app).
  var ref=(new URLSearchParams(location.search).get("ref")||"").toUpperCase();
  if(/^[A-Z2-9]{8}$/.test(ref)){target+="%26ref%3D"+ref;}
  var queued=true;
  try{
    var ls=null; try{ls=localStorage;}catch(e){}
    function keep(k,v){if(ls){try{ls.setItem(k,v);}catch(e){}}}
    function read(k){if(ls){try{return ls.getItem(k);}catch(e){}}return null;}
    var cid=read("lr_cid")||(Math.floor(Math.random()*1e9)+"."+Math.floor(Date.now()/1000));
    keep("lr_cid",cid);
    var fresh=!read("lr_seen"); keep("lr_seen","1");
    var base="https://www.google-analytics.com/g/collect?v=2&tid=G-M2YELX05EM"+
      "&cid="+encodeURIComponent(cid)+
      "&sid="+Math.floor(Date.now()/1000)+"&sct=1&seg=1"+
      "&ul="+encodeURIComponent((navigator.language||"en").toLowerCase())+
      "&sr="+screen.width+"x"+screen.height+
      "&dl="+encodeURIComponent(location.href)+
      "&dt="+encodeURIComponent(document.title)+
      (document.referrer?"&dr="+encodeURIComponent(document.referrer):"")+
      (fresh?"&_fv=1&_ss=1":"");
    function hit(tail){
      var u=base+"&_p="+Math.floor(Math.random()*1e9)+tail;
      // sendBeacon survives unload; the image fallback needs a moment, so remember which ran.
      if(navigator.sendBeacon&&navigator.sendBeacon(u))return;
      queued=false; new Image().src=u;
    }
    hit("&_s=1&en=page_view&_et=1");
    hit("&_s=2&en=install_click&ep.placement="+C+"&ep.invite="+(ref?"yes":"no"));
  }catch(e){}
  setTimeout(function(){location.replace(target);}, queued?0:400);
})();
</script>
